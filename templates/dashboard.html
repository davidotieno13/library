<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand">📊 Dashboard</a>
    <a href="/" class="btn btn-info">Home</a>
    <a href="/logout" class="btn btn-danger">Logout</a>
</nav>

<div class="container mt-4">

<div class="row">
    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h5>Total Books</h5>
            <h2 id="totalBooks">0</h2>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h5>Borrowed</h5>
            <h2 id="borrowed">0</h2>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h5>Available</h5>
            <h2 id="available">0</h2>
        </div>
    </div>
</div>

<div class="card mt-4 p-4">
    <canvas id="chart"></canvas>
</div>

</div>

<script>
async function loadStats() {
    let res = await fetch("/stats");
    let data = await res.json();

    document.getElementById("totalBooks").innerText = data.total_books;
    document.getElementById("borrowed").innerText = data.borrowed;
    document.getElementById("available").innerText = data.available;

    new Chart(document.getElementById("chart"), {
        type: 'bar',
        data: {
            labels: ["Total", "Borrowed", "Available"],
            datasets: [{
                label: "Library Stats",
                data: [data.total_books, data.borrowed, data.available]
            }]
        }
    });
}

loadStats();
</script>

</body>
</html>
